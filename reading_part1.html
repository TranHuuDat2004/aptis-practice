<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading - Part 1 Quiz</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/quiz.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="icon" href="img/favicon.png" type="image/x-icon">

    <!-- 1. Tích hợp CSS của Driver.js -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/driver.js@1.0.1/dist/driver.css"/>

    <style>
        /* CSS cho nút Help/Tour */
        .tour-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #fff;
            border: 1px solid #ddd;
            color: #333;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            z-index: 999;
            font-size: 24px;
            transition: transform 0.2s, background-color 0.2s;
        }

        .tour-btn:hover {
            transform: scale(1.1);
            background-color: #f8f9fa;
        }

        /* Tùy chỉnh giao diện Driver.js */
        .driver-popover.driverjs-theme {
            background-color: #fff;
            color: #333;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            max-width: 350px;
        }
        
        .driver-popover.driverjs-theme .driver-popover-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--primary-blue, #007bff);
        }
        
        .driver-popover.driverjs-theme .driver-popover-description {
            font-size: 14px;
            line-height: 1.6;
            color: #555;
        }

        .driver-popover.driverjs-theme button {
            background-color: var(--primary-blue, #007bff);
            color: #fff;
            text-shadow: none;
            border: none;
            border-radius: 4px;
            padding: 6px 12px;
        }
    </style>
</head>

<body>
    <header id="header-placeholder"></header>
    
    <!-- 2. Nút kích hoạt lại Tour -->
    <div class="tour-btn" id="restart-tour" title="Hướng dẫn sử dụng">❓</div>

    <div class="content-pusher">
        <div class="container">
            <div class="page-intro">
                <h1>Reading - Part 1 Quiz</h1>
                <p>Chọn từ đúng để điền vào chỗ trống trong mỗi câu.</p>
            </div>
            <div class="explanation-box">
                <h3>💡 Phương pháp làm bài</h3>
                <p>Mỗi bộ 5 câu hỏi sẽ điền 5 từ cho sẵn. Hãy đọc kỹ ngữ cảnh của từng câu để chọn ra đáp án phù hợp
                    nhất. Chú ý đến loại từ (danh từ, động từ, tính từ) và ý nghĩa của câu.</p>
            </div>
            <main id="quiz-container">
                <!-- Nội dung các bộ câu hỏi sẽ được JS chèn vào đây -->
            </main>
            <div class="pagination-controls" id="pagination-controls">
                <!-- Nút phân trang sẽ được JS chèn vào đây -->
            </div>
            <div class="card-actions" style="justify-content: center; margin-top: 20px;">
                <button class="action-btn check-answer-btn" id="check-answers-btn">Kiểm tra đáp án</button>
            </div>
            <div id="result-message" class="feedback-message" style="text-align: center; margin-top: 20px;"></div>
        </div>
        <footer id="footer-placeholder"></footer>
    </div>

    <script src="js/data-reading-part1.js"></script>
    <script src="js/main.js"></script>
    
    <!-- 3. Tích hợp Script của Driver.js -->
    <script src="https://cdn.jsdelivr.net/npm/driver.js@1.0.1/dist/driver.js.iife.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const quizContainer = document.getElementById('quiz-container');
            const paginationControls = document.getElementById('pagination-controls');
            const checkAnswersBtn = document.getElementById('check-answers-btn');
            const resultMessage = document.getElementById('result-message');

            const topics = typeof readingPart1Data !== 'undefined' ? readingPart1Data : []; 
            const topicsPerPage = 1; 
            let currentPage = 1;

            function renderPage(page) {
                quizContainer.innerHTML = '';
                currentPage = page;
                const topicIndex = page - 1;
                const topic = topics[topicIndex];

                if (!topic) {
                    quizContainer.innerHTML = '<p class="error">Không tìm thấy dữ liệu câu hỏi.</p>';
                    return;
                }

                const quizCard = document.createElement('div');
                quizCard.className = 'quiz-card part1-quiz';
                quizCard.dataset.topicIndex = topicIndex;

                let questionsHTML = '';
                topic.questions.forEach((q, qIndex) => {
                    let optionsHTML = '';
                    q.options.forEach(option => {
                        optionsHTML += `
                            <label class="radio-label">
                                <input type="radio" name="topic-${topicIndex}-q-${qIndex}" value="${option}">
                                <span>${option}</span>
                            </label>
                        `;
                    });

                    questionsHTML += `
                        <div class="part1-question-item" data-question-index="${qIndex}">
                            <p class="question-text">${q.text.replace('___', '<strong>___</strong>')}</p>
                            <div class="options-container">${optionsHTML}</div>
                            <div class="feedback-answer" style="display: none;"></div>
                        </div>
                    `;
                });

                quizCard.innerHTML = `
                    <h2 class="part1-topic-title">${topic.title}</h2>
                    ${questionsHTML}
                `;
                quizContainer.appendChild(quizCard);
                renderPagination();
                resultMessage.textContent = '';
            }

            function renderPagination() {
                paginationControls.innerHTML = '';
                const pageCount = topics.length;
                for (let i = 1; i <= pageCount; i++) {
                    const button = document.createElement('button');
                    button.textContent = i;
                    button.className = (i === currentPage) ? 'active' : '';
                    button.addEventListener('click', () => {
                        renderPage(i);
                        // Cuộn lên đầu khi chuyển trang để dễ xem
                        document.querySelector('.page-intro').scrollIntoView({ behavior: 'smooth' });
                    });
                    paginationControls.appendChild(button);
                }
            }

            checkAnswersBtn.addEventListener('click', function () {
                const currentCard = quizContainer.querySelector('.part1-quiz');
                if (!currentCard) return;

                const topicIndex = parseInt(currentCard.dataset.topicIndex);
                const topicData = topics[topicIndex];
                const questionItems = currentCard.querySelectorAll('.part1-question-item');
                let correctCount = 0;

                questionItems.forEach(item => {
                    const qIndex = parseInt(item.dataset.questionIndex);
                    const questionData = topicData.questions[qIndex];
                    const selectedRadio = item.querySelector(`input[name="topic-${topicIndex}-q-${qIndex}"]:checked`);
                    const feedbackDiv = item.querySelector('.feedback-answer');

                    item.classList.remove('correct', 'incorrect');
                    feedbackDiv.style.display = 'block';

                    if (selectedRadio) {
                        if (selectedRadio.value === questionData.answer) {
                            item.classList.add('correct');
                            feedbackDiv.textContent = 'Chính xác!';
                            feedbackDiv.style.color = '#28a745';
                            correctCount++;
                        } else {
                            item.classList.add('incorrect');
                            feedbackDiv.innerHTML = `Sai rồi! Đáp án đúng là: <strong>${questionData.answer}</strong>`;
                            feedbackDiv.style.color = '#dc3545';
                        }
                    } else {
                        item.classList.add('incorrect');
                        feedbackDiv.innerHTML = `Bạn chưa chọn đáp án. Đáp án đúng là: <strong>${questionData.answer}</strong>`;
                        feedbackDiv.style.color = '#dc3545';
                    }
                });

                resultMessage.innerHTML = `Bạn đã trả lời đúng <strong>${correctCount}/${questionItems.length}</strong> câu.`;
                resultMessage.style.color = correctCount === questionItems.length ? '#28a745' : '#333';
            });

            // Render trang đầu tiên
            renderPage(1);

            // --- KÍCH HOẠT TOUR HƯỚNG DẪN ---
            // Gọi sau khi render xong để đảm bảo các element đã tồn tại
            setTimeout(initReadingPart1Tour, 800);
        });

        // HÀM KHỞI TẠO TOUR CHO READING PART 1
        function initReadingPart1Tour() {
            const driver = window.driver.js.driver;
            
            const driverObj = driver({
                showProgress: true,
                animate: true,
                doneBtnText: 'Đã hiểu',
                nextBtnText: 'Tiếp theo',
                prevBtnText: 'Quay lại',
                popoverClass: 'driverjs-theme',
                steps: [
                    { 
                        element: '.explanation-box', 
                        popover: { 
                            title: 'Reading Part 1', 
                            description: 'Nhiệm vụ của bạn là chọn từ thích hợp nhất để điền vào chỗ trống. Đây là phần kiểm tra ngữ pháp và từ vựng.', 
                            side: "bottom", 
                            align: 'center' 
                        } 
                    },
                    { 
                        element: '.part1-quiz', 
                        popover: { 
                            title: 'Bộ câu hỏi', 
                            description: 'Mỗi chủ đề sẽ có 5 câu hỏi trắc nghiệm.', 
                            side: "top", 
                            align: 'center' 
                        } 
                    },
                    { 
                        element: '.part1-question-item:first-child .options-container', 
                        popover: { 
                            title: 'Chọn đáp án', 
                            description: 'Bấm vào một trong các lựa chọn (radio button) để trả lời.', 
                            side: "left", 
                            align: 'center' 
                        } 
                    },
                    { 
                        element: '#check-answers-btn', 
                        popover: { 
                            title: 'Kiểm tra kết quả', 
                            description: 'Sau khi làm xong cả 5 câu, hãy bấm nút này để xem bạn đúng bao nhiêu câu và xem đáp án chi tiết.', 
                            side: "top", 
                            align: 'center' 
                        } 
                    },
                    { 
                        element: '#pagination-controls', 
                        popover: { 
                            title: 'Chuyển chủ đề', 
                            description: 'Bấm vào các số trang để chuyển sang bộ câu hỏi luyện tập khác.', 
                            side: "top", 
                            align: 'center' 
                        } 
                    },
                    { 
                        element: '#restart-tour', 
                        popover: { 
                            title: 'Hỗ trợ', 
                            description: 'Bấm vào đây bất cứ lúc nào để xem lại hướng dẫn.', 
                            side: "left", 
                            align: 'center' 
                        } 
                    }
                ]
            });

            // Logic tự động chạy lần đầu
            showTourHint('hasSeenReadingPart1Tour', () => driverObj.drive());

            // Gán sự kiện cho nút ?
            document.getElementById('restart-tour').addEventListener('click', () => {
                driverObj.drive();
            });
        }
    </script>
</body>

</html>
